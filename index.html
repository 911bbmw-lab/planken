<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор отрезков v3</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 4px; display: none; border-left: 5px solid #6c757d; }
        .success { background: #d4edda; color: #155724; border-left-color: #28a745; }
        .info-box { background: #e2e3e5; color: #383d41; border-left-color: #17a2b8; }
    </style>
</head>
<body>

<div class="card">
    <h2>Подбор комбинации отрезков</h2>
    <p>Размеры: A = 95 мм, B = 120 мм, C = 145 мм</p>
    
    <div class="input-group">
        <label for="lengthD">Введите общую длину D (в мм):</label>
        <input type="number" id="lengthD" min="1" placeholder="Например, 1000">
    </div>

    <div class="input-group">
        <label for="calcMode">Режим расчета:</label>
        <select id="calcMode">
            <option value="min_rem">Вариант 1: Идеальный остаток (стремление к 0)</option>
            <option value="balanced_rem">Вариант 2: Равномерно (остаток от 50 до 90 мм)</option>
        </select>
    </div>
    
    <button onclick="calculate()">Рассчитать</button>

    <div id="resultBox" class="result"></div>
</div>

<script>
function calculate() {
    const a = 95, b = 120, c = 145;
    const dInput = document.getElementById('lengthD').value;
    const mode = document.getElementById('calcMode').value;
    const d = parseInt(dInput);
    const resultBox = document.getElementById('resultBox');

    if (isNaN(d) || d <= 0) {
        resultBox.style.display = 'block';
        resultBox.className = 'result';
        resultBox.innerHTML = '<strong style="color:red;">Ошибка: введите корректное число больше 0.</strong>';
        return;
    }

    let allSolutions = [];

    // Полный перебор комбинаций
    const maxC = Math.floor(d / c);
    for (let countC = 0; countC <= maxC; countC++) {
        let remAfterC = d - countC * c;
        
        const maxB = Math.floor(remAfterC / b);
        for (let countB = 0; countB <= maxB; countB++) {
            let remAfterB = remAfterC - countB * b;
            
            const maxA = Math.floor(remAfterB / a);
            for (let countA = 0; countA <= maxA; countA++) {
                let remainder = remAfterB - countA * a;

                let counts = [countA, countB, countC];
                let spread = Math.max(...counts) - Math.min(...counts);

                allSolutions.push({
                    comb: counts,
                    remainder: remainder,
                    spread: spread,
                    a: countA,
                    b: countB,
                    c: countC
                });
            }
        }
    }

    // Фильтрация и сортировка в зависимости от выбранного режима
    if (mode === 'min_rem') {
        // Вариант 1: обычный расчет (минимизация остатка)
        allSolutions.sort((x, y) => {
            if (x.remainder !== y.remainder) return x.remainder - y.remainder;
            if (x.spread !== y.spread) return x.spread - y.spread;
            if (x.b !== y.b) return y.b - x.b;
            return y.c - x.c;
        });
    } else {
        // Вариант 2: остаток строго от 50 до 90 мм
        allSolutions = allSolutions.filter(x => x.remainder >= 50 && x.remainder <= 90);

        if (allSolutions.length === 0) {
            resultBox.style.display = 'block';
            resultBox.className = 'result';
            resultBox.innerHTML = '<strong>Не удалось подобрать комбинацию с остатком от 50 до 90 мм.</strong>';
            return;
        }

        // Новая сортировка Варианта 2: 
        // 1. Равномерность (минимальный разброс spread)
        // 2. Приоритет A (чем больше A, тем выше)
        // 3. Приоритет B (чем больше B, тем выше)
        // 4. Приоритет C (чем больше C, тем выше)
        allSolutions.sort((x, y) => {
            if (x.spread !== y.spread) return x.spread - y.spread;
            if (x.a !== y.a) return y.a - x.a; // по убыванию A
            if (x.b !== y.b) return y.b - x.b; // по убыванию B
            return y.c - x.c;                 // по убыванию C
        });
    }

    const best = allSolutions[0];
    const comb = best.comb;
    const rem = best.remainder;

    resultBox.style.display = 'block';
    
    if (mode === 'balanced_rem') {
        resultBox.className = 'result info-box';
    } else if (rem === 0) {
        resultBox.className = 'result success';
    } else {
        resultBox.className = 'result';
    }

    let html = `<strong>Найдено решение (${mode === 'min_rem' ? 'Вариант 1' : 'Вариант 2'}):</strong><br><br>`;
    html += `• Отрезков A (95 мм): ${comb[0]} шт.<br>`;
    html += `• Отрезков B (120 мм): ${comb[1]} шт.<br>`;
    html += `• Отрезков C (145 мм): ${comb[2]} шт.<br><br>`;
    html += `<strong>Финальный остаток:</strong> ${rem} мм`;

    if (mode === 'min_rem' && rem === 0) {
        html += `<br><br><em>Остаток равен 0. Расчет идеально завершен!</em>`;
    }

    resultBox.innerHTML = html;
}
</script>

</body>
</html>
