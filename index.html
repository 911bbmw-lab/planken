<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор отрезков — Сравнение двух вариантов</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; text-align: center; }
        .input-row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .input-group { flex: 1; min-width: 200px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; font-weight: bold; }
        button:hover { background: #0056b3; }
        
        .results-container { display: flex; gap: 20px; margin-top: 25px; flex-wrap: wrap; display: none; }
        .result-column { flex: 1; min-width: 300px; background: #e9ecef; padding: 15px; border-radius: 4px; border-left: 5px solid #6c757d; box-sizing: border-box; }
        .result-column.success { background: #d4edda; color: #155724; border-left-color: #28a745; }
        .result-column.info-box { background: #e2e3e5; color: #383d41; border-left-color: #17a2b8; }
        
        .error-message { color: red; font-weight: bold; margin-top: 15px; display: none; text-align: center; }
        .facade-img { width: 100%; height: auto; max-height: 250px; object-fit: cover; border-radius: 4px; margin-bottom: 15px; border: 1px solid #ddd; display: block; margin: 0 auto 20px auto; max-width: 500px; }

        /* Стили для визуальной шкалы отрезков */
        .visual-bar { display: flex; width: 100%; height: 35px; border-radius: 4px; overflow: hidden; margin-top: 15px; border: 1px solid #ccc; background: #fff; }
        .segment { display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: bold; text-shadow: 1px 1px 1px rgba(0,0,0,0.4); height: 100%; box-sizing: border-box; }
        .seg-a { background-color: #28a745; }
        .seg-b { background-color: #ffc107; color: #212529; text-shadow: none; }
        .seg-c { background-color: #dc3545; }
        .seg-rem { background-color: #6c757d; }
        
        .legend { display: flex; justify-content: center; gap: 20px; margin-top: 20px; font-size: 13px; flex-wrap: wrap; border-top: 1px solid #ddd; padding-top: 15px; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 14px; height: 14px; border-radius: 2px; display: inline-block; }
    </style>
</head>
<body>

<div class="card">
    <h2>Подбор комбинации отрезков</h2>
    <p style="text-align: center; color: #666;">Размеры: A = 95 мм, B = 120 мм, C = 145 мм</p>
    
    <img class="facade-img" src="https://unsplash.com" alt="Вертикальный планкен на фасаде">

    <div class="input-row">
        <div class="input-group">
            <label for="lengthD">Введите общую длину D (в мм):</label>
            <input type="number" id="lengthD" min="1" placeholder="Например, 1000">
        </div>
        <div class="input-group">
            <label for="countAInput">Отрезков A (фиксировано):</label>
            <input type="number" id="countAInput" min="0" value="0" placeholder="0 если свободно">
        </div>
    </div>
    
    <button onclick="calculate()">Рассчитать оба варианта</button>

    <div id="errorBox" class="error-message"></div>

    <div id="resultsContainer" class="results-container">
        <!-- Вариант 1 -->
        <div id="variant1" class="result-column"></div>
        <!-- Вариант 2 -->
        <div id="variant2" class="result-column"></div>
    </div>
    
    <div id="legendBox" class="legend" style="display: none;">
        <div class="legend-item"><span class="dot seg-a"></span> A (95 мм)</div>
        <div class="legend-item"><span class="dot seg-b"></span> B (120 мм)</div>
        <div class="legend-item"><span class="dot seg-c"></span> C (145 мм)</div>
        <div class="legend-item"><span class="dot seg-rem"></span> Излишек (Остаток)</div>
    </div>
</div>

<script>
function generateVisualBarHtml(comb, rem, d, a, b, c) {
    let html = `<div class="visual-bar">`;
    for (let i = 0; i < comb[0]; i++) {
        html += `<div class="segment seg-a" style="width: ${(a / d) * 100}%" title="Отрезок A (95 мм)">A</div>`;
    }
    for (let i = 0; i < comb[1]; i++) {
        html += `<div class="segment seg-b" style="width: ${(b / d) * 100}%" title="Отрезок B (120 мм)">B</div>`;
    }
    for (let i = 0; i < comb[2]; i++) {
        html += `<div class="segment seg-c" style="width: ${(c / d) * 100}%" title="Отрезок C (145 мм)">C</div>`;
    }
    if (rem > 0) {
        html += `<div class="segment seg-rem" style="width: ${(rem / d) * 100}%" title="Остаток (${rem} мм)">${rem}</div>`;
    }
    html += `</div>`;
    return html;
}

function calculate() {
    const a = 95, b = 120, c = 145;
    const dInput = document.getElementById('lengthD').value;
    const countAInput = document.getElementById('countAInput').value;
    
    const d = parseInt(dInput);
    let fixedCountA = parseInt(countAInput);

    const errorBox = document.getElementById('errorBox');
    const resultsContainer = document.getElementById('resultsContainer');
    const v1Box = document.getElementById('variant1');
    const v2Box = document.getElementById('variant2');
    const legendBox = document.getElementById('legendBox');

    errorBox.style.display = 'none';
    resultsContainer.style.display = 'none';
    legendBox.style.display = 'none';

    if (isNaN(d) || d <= 0) {
        errorBox.style.display = 'block';
        errorBox.innerHTML = 'Ошибка: введите корректное число больше 0.';
        return;
    }

    if (isNaN(fixedCountA) || fixedCountA < 0) {
        fixedCountA = 0;
    }

    let remAfterFixedA = d - (fixedCountA * a);
    if (remAfterFixedA < 0) {
        errorBox.style.display = 'block';
        errorBox.innerHTML = 'Ошибка: заданное количество отрезков A превышает общую длину D!';
        return;
    }

    let allSolutions = [];
    const maxC = Math.floor(remAfterFixedA / c);
    for (let countC = 0; countC <= maxC; countC++) {
        let remAfterC = remAfterFixedA - countC * c;
        const maxB = Math.floor(remAfterC / b);
        for (let countB = 0; countB <= maxB; countB++) {
            let remainder = remAfterC - countB * b;

            let counts = [fixedCountA, countB, countC];
            let spread = Math.max(...counts) - Math.min(...counts);

            allSolutions.push({
                comb: counts,
                remainder: remainder,
                spread: spread,
                a: fixedCountA,
                b: countB,
                c: countC
            });
        }
    }

    if (allSolutions.length === 0) {
        errorBox.style.display = 'block';
        errorBox.innerHTML = 'Не удалось найти ни одной комбинации для заданных условий.';
        return;
    }

    // --- ОБРАБОТКА ВАРИАНТА 1 ---
    let v1Solutions = [...allSolutions];
    v1Solutions.sort((x, y) => {
        if (x.remainder !== y.remainder) return x.remainder - y.remainder;
        if (x.spread !== y.spread) return x.spread - y.spread;
        if (x.b !== y.b) return y.b - x.b;
        return y.c - x.c;
    });
    
    let bestV1 = v1Solutions[0];
    let htmlV1 = `<h3>Вариант 1: Допустимый остаток (0-5 мм)</h3>`;
    htmlV1 += `• Отрезков A: ${bestV1.comb[0]} шт.<br>`;
    htmlV1 += `• Отрезков B: ${bestV1.comb[1]} шт.<br>`;
    htmlV1 += `• Отрезков C: ${bestV1.comb[2]} шт.<br><br>`;
    htmlV1 += `<strong>Финальный остаток:</strong> ${bestV1.remainder} мм<br>`;
    if (bestV1.remainder <= 5) {
        v1Box.className = "result-column success";
        htmlV1 += `<small><em>✔ Остаток уложился в предел!</em></small>`;
    } else {
        v1Box.className = "result-column";
    }
    htmlV1 += generateVisualBarHtml(bestV1.comb, bestV1.remainder, d, a, b, c);
    v1Box.innerHTML = htmlV1;

    // --- ОБРАБОТКА ВАРИАНТА 2 ---
    let v2Solutions = allSolutions.filter(x => x.remainder >= 50 && x.remainder <= 90);
    
    if (v2Solutions.length === 0) {
        v2Box.className = "result-column";
        v2Box.innerHTML = `<h3>Вариант 2: Равномерно (50-90 мм)</h3><br><p style="color:#d9534f;"><strong>Нет решений!</strong> Ни один вариант не дал остатка в пределах 50-90 мм при заданном количестве А.</p>`;
    } else {
        v2Solutions.sort((x, y) => {
            if (x.spread !== y.spread) return x.spread - y.spread;
            if (x.a !== y.a) return y.a - x.a;
            if (x.b !== y.b) return y.b - x.b;
            return y.c - x.c;
        });
        
        let bestV2 = v2Solutions[0];
        v2Box.className = "result-column info-box";
        let htmlV2 = `<h3>Вариант 2: Равномерно (50-90 мм)</h3>`;
        htmlV2 += `• Отрезков A: ${bestV2.comb[0]} шт.<br>`;
        htmlV2 += `• Отрезков B: ${bestV2.comb[1]} шт.<br>`;
        htmlV2 += `• Отрезков C: ${bestV2.comb[2]} шт.<br><br>`;
        htmlV2 += `<strong>Финальный остаток:</strong> ${bestV2.remainder} мм<br>`;
        htmlV2 += `<small><em>✔ Разброс равномерности: ${bestV2.spread}</em></small>`;
        htmlV2 += generateVisualBarHtml(bestV2.comb, bestV2.remainder, d, a, b, c);
        v2Box.innerHTML = htmlV2;
    }

    // Отображаем контейнеры
    resultsContainer.style.display = 'flex';
    legendBox.style.display = 'flex';
}
</script>

</body>
</html>
